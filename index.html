<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Kütüphanem</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#fffaf3" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kütüphanem" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Apply the saved theme before React loads, including the iOS status-bar hints.
      (function () {
        var theme;
        try { theme = localStorage.getItem("theme"); } catch (_) {}
        if (theme !== "dark" && theme !== "light") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        var root = document.documentElement;
        root.classList.toggle("dark", theme === "dark");
        root.style.colorScheme = theme;
        root.style.backgroundColor = theme === "dark" ? "#020617" : "#fffaf3";
        document.querySelector('meta[name="theme-color"]').content = root.style.backgroundColor;
        document.querySelector('meta[name="color-scheme"]').content = theme;
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = theme === "dark" ? "black" : "default";
      })();
    </script>
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=2" />
    <link rel="icon" type="image/svg+xml" href="/icons/brand.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <style>
      .boot{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#fffaf3;color:#0f172a;font:16px system-ui,sans-serif}.dark .boot{background:#020617;color:#f8fafc}.boot img{border-radius:24px}.boot strong{font-size:24px}.boot-ring{width:24px;height:24px;border:3px solid #fed7aa;border-top-color:#ea580c;border-radius:50%;animation:boot-spin .9s linear infinite}@keyframes boot-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.boot-ring{animation:none}}
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status"><img src="/icons/icon-192.png" width="80" height="80" alt="" /><strong>Kütüphanem</strong><span class="boot-ring" aria-hidden="true"></span><span>Uygulama hazırlanıyor…</span></div></div>
    <noscript>Uygulamayı kullanmak için tarayıcında JavaScript’i etkinleştir.</noscript>
    <script src="/boot-recovery.js"></script>
    <script type="module" src="/src/main.tsx" onerror="window.recoverAppVersion && window.recoverAppVersion(false)"></script>
  </body>
</html>
