<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fffaf3"><title>Kütüphanem · Güncelleme</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#fffaf3;color:#172b29;font:16px system-ui}main{max-width:360px;margin:24px;padding:28px;background:white;border:1px solid #eee;border-radius:24px}h1{font-size:24px}p{font-size:14px;line-height:1.8;color:#64748b}button,a{display:block;box-sizing:border-box;width:100%;padding:16px;border:0;border-radius:14px;background:#172b29;color:white;font:600 14px system-ui;text-align:center;text-decoration:none}button:disabled{opacity:.5}#status{min-height:48px}</style><main><h1>Uygulamanı yenileyelim.</h1><p>Uygulama dosyaları kontrol edilip yeni sürüme geçilecek. Hesabın, kitapların ve kayıtların silinmez. Kaydetmediğin düzenlemeleri önce tamamla.</p><button id="update">Güncelle ve aç</button><p id="status" role="status"></p><a href="/today" hidden id="open">Uygulamayı aç</a></main><script>
const button=document.getElementById('update'),status=document.getElementById('status');
button.onclick=async()=>{button.disabled=true;status.textContent='Yeni sürüm kontrol ediliyor…';try{
const response=await fetch('/version.json?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(15000)});if(!response.ok)throw Error();const version=await response.json();if(!version.commit)throw Error();
if('serviceWorker'in navigator){const reg=await navigator.serviceWorker.getRegistration('/');if(reg){await reg.update();const worker=reg.installing;if(worker)await new Promise((resolve,reject)=>{const timeout=setTimeout(()=>reject(Error()),25000);const changed=()=>{if(worker.state==='installed'||worker.state==='activated'){clearTimeout(timeout);resolve()}else if(worker.state==='redundant'){clearTimeout(timeout);reject(Error())}};worker.addEventListener('statechange',changed);changed()});if(reg.waiting)await new Promise(resolve=>{const done=()=>{navigator.serviceWorker.removeEventListener('controllerchange',done);resolve()};navigator.serviceWorker.addEventListener('controllerchange',done);setTimeout(done,5000);reg.waiting.postMessage({type:'SKIP_WAITING'})});}}
status.textContent='Sürüm '+version.commit+' hazır. Uygulama açılıyor…';location.replace('/today');
}catch{status.textContent='Güncelleme dosyalarına ulaşılamadı. İnternet bağlantını kontrol edip tekrar dene.';button.disabled=false;}};
</script></html>
